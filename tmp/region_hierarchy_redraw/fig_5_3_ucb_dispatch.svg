<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="100%" height="100%" fill="#ffffff"/>

<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,5 L0,10 Z" fill="#64748b"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>
<style>
  text {
    font-family: Microsoft YaHei, Noto Sans CJK SC, SimHei, Arial, sans-serif;
    dominant-baseline: alphabetic;
  }
  .card {
    filter: url(#shadow);
  }
</style>

<rect class="card" x="80" y="170" width="310" height="120" rx="18" fill="#e6f2ff" stroke="#7aa7d9" stroke-width="2"/>
<text x="235.0" y="208" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">读取后验状态</text>
<text x="235.0" y="237" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">隐性权重</text>
<text x="235.0" y="266" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">不确定性方差</text>
<rect class="card" x="465" y="170" width="310" height="120" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="620.0" y="210" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">计算 UCB 分数</text>
<text x="620.0" y="237" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">权重均值 + 方差奖励</text>
<text x="620.0" y="264" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">五类偏好维度</text>
<rect class="card" x="850" y="170" width="310" height="120" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="1005.0" y="210" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">选择探测维度</text>
<text x="1005.0" y="237" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">结合查询上下文打破并列</text>
<text x="1005.0" y="264" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">确定下一轮目标</text>
<rect class="card" x="1235" y="170" width="310" height="120" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="1390.0" y="210" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">映射确定性探针</text>
<text x="1390.0" y="237" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">学校层次 -&gt; 实力探针</text>
<text x="1390.0" y="264" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">专业/地域 -&gt; 联合探针</text>
<rect class="card" x="1515" y="380" width="310" height="120" rx="18" fill="#fff3cf" stroke="#d6a23a" stroke-width="2"/>
<text x="1670.0" y="420" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">强制纳入目标探针</text>
<text x="1670.0" y="447" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">规划器必须包含目标</text>
<text x="1670.0" y="474" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">语言模型不能绕过</text>
<rect class="card" x="1135" y="380" width="310" height="120" rx="18" fill="#e6f2ff" stroke="#7aa7d9" stroke-width="2"/>
<text x="1290.0" y="420" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">运行证据探针</text>
<text x="1290.0" y="447" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">SQL / 本体 / 画像</text>
<text x="1290.0" y="474" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">返回真实候选</text>
<rect class="card" x="755" y="380" width="310" height="120" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="910.0" y="420" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">选择最大分歧候选对</text>
<text x="910.0" y="447" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">最大化特征差异</text>
<text x="910.0" y="474" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">避免重复追问</text>
<rect class="card" x="375" y="380" width="310" height="120" rx="18" fill="#f4f6f8" stroke="#9aa4af" stroke-width="2"/>
<text x="530.0" y="420" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">提出边际替代问题</text>
<text x="530.0" y="447" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">A/B 候选对</text>
<text x="530.0" y="474" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">等待用户反馈</text>
<rect class="card" x="80" y="600" width="355" height="120" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="257.5" y="640" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">应用反馈更新</text>
<text x="257.5" y="667" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">接受/拒绝更新权重</text>
<text x="257.5" y="694" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">犹豫则提高方差</text>
<rect class="card" x="620" y="600" width="540" height="120" rx="18" fill="#f4f6f8" stroke="#9aa4af" stroke-width="2"/>
<text x="890.0" y="640" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">收敛判定</text>
<text x="890.0" y="667" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">总方差足够小或轮次达到上限</text>
<text x="890.0" y="694" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">进入最终报告</text>
<path d="M390,230 L465,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M775,230 L850,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1160,230 L1235,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1545,230 1670,230 1670,380" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1515,440 L1445,440" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1135,440 L1065,440" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M755,440 L685,440" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="375,440 255,440 255,600" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M435,660 L620,660" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="255,600 255,535 235,535 235,290" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 8"/>
<text x="235" y="523" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">后验循环</text>
</svg>
