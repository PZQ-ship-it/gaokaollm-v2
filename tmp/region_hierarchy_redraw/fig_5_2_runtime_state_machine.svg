<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="100%" height="100%" fill="#ffffff"/>

<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,5 L0,10 Z" fill="#64748b"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>
<style>
  text {
    font-family: Microsoft YaHei, Noto Sans CJK SC, SimHei, Arial, sans-serif;
    dominant-baseline: alphabetic;
  }
  .card {
    filter: url(#shadow);
  }
</style>

<rect class="card" x="90" y="190" width="260" height="100" rx="18" fill="#f4f6f8" stroke="#9aa4af" stroke-width="2"/>
<text x="220.0" y="234" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">开始</text>
<text x="220.0" y="258" text-anchor="middle" font-size="18" font-weight="500" fill="#1f2937">接收用户话语</text>
<rect class="card" x="360" y="190" width="260" height="100" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="490.0" y="234" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">语义归一</text>
<text x="490.0" y="258" text-anchor="middle" font-size="18" font-weight="500" fill="#1f2937">查询重写 / 偏好轴</text>
<rect class="card" x="720" y="190" width="260" height="100" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="850.0" y="234" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">约束解析</text>
<text x="850.0" y="258" text-anchor="middle" font-size="18" font-weight="500" fill="#1f2937">显式约束 / 基线候选</text>
<rect class="card" x="1080" y="190" width="260" height="100" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="1210.0" y="234" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">主动探测规划</text>
<text x="1210.0" y="258" text-anchor="middle" font-size="18" font-weight="500" fill="#1f2937">探针计划 / 候选机会</text>
<rect class="card" x="1440" y="190" width="260" height="100" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="1570.0" y="234" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">证据谈判</text>
<text x="1570.0" y="258" text-anchor="middle" font-size="18" font-weight="500" fill="#1f2937">边际替代问题</text>
<rect class="card" x="1440" y="520" width="260" height="100" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="1570.0" y="564" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">偏好后验追踪</text>
<text x="1570.0" y="588" text-anchor="middle" font-size="18" font-weight="500" fill="#1f2937">权重 / 方差</text>
<rect class="card" x="1080" y="520" width="260" height="100" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="1210.0" y="564" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">继续探测判定</text>
<text x="1210.0" y="588" text-anchor="middle" font-size="18" font-weight="500" fill="#1f2937">下一探针或停止</text>
<rect class="card" x="720" y="520" width="260" height="100" rx="18" fill="#f4f6f8" stroke="#9aa4af" stroke-width="2"/>
<text x="850.0" y="564" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">生成报告</text>
<text x="850.0" y="588" text-anchor="middle" font-size="18" font-weight="500" fill="#1f2937">最终推荐</text>
<rect class="card" x="360" y="520" width="260" height="100" rx="18" fill="#f4f6f8" stroke="#9aa4af" stroke-width="2"/>
<text x="490.0" y="564" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">结束</text>
<text x="490.0" y="588" text-anchor="middle" font-size="18" font-weight="500" fill="#1f2937">输出回答</text>
<rect class="card" x="1505" y="360" width="300" height="90" rx="18" fill="#fff3cf" stroke="#d6a23a" stroke-width="2"/>
<text x="1655.0" y="398" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">暂停提问</text>
<text x="1655.0" y="425" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">等待用户回答</text>
<rect class="card" x="90" y="720" width="660" height="90" rx="18" fill="#e6f2ff" stroke="#7aa7d9" stroke-width="2"/>
<text x="420.0" y="758" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">运行时状态</text>
<text x="420.0" y="785" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">消息 / 约束 / 隐性权重 / 方差 / 最新候选差异</text>
<rect class="card" x="930" y="720" width="660" height="90" rx="18" fill="#e6f2ff" stroke="#7aa7d9" stroke-width="2"/>
<text x="1260.0" y="758" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">路由条件</text>
<text x="1260.0" y="785" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">缺少约束则结束；收到反馈则更新；收敛后报告</text>
<path d="M350,240 L360,240" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M620,240 L720,240" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M980,240 L1080,240" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1340,240 L1440,240" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1570,290 L1570,360" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1570,450 L1570,520" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1570.0" y="475.0" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">恢复执行</text>
<path d="M1440,570 L1340,570" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1080,570 L980,570" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M720,570 L620,570" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1210,520 1210,380 1210,290" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 8"/>
<text x="1210" y="368" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">继续探测</text>
<polyline points="850,290 850,480 720,520" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 8"/>
<text x="850" y="468" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">停止</text>
<path d="M420,720 L540,620" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 8"/>
<path d="M1260,720 L1260,620" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 8"/>
</svg>
