<text x="280.0" y="776" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">质量 / 就业 / 地域画像</text>
<text x="280.0" y="803" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">专业质量 / 就业结果 / 地域层级</text>
<rect class="card" x="630" y="260" width="320" height="120" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="790.0" y="298" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">LLM 机会规划</text>
<text x="790.0" y="327" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">选择探测顺序</text>
<text x="790.0" y="356" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">输出澄清提示</text>
