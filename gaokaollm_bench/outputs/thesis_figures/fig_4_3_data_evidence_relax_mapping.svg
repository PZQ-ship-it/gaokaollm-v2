<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="100%" height="100%" fill="#ffffff"/>

<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,5 L0,10 Z" fill="#64748b"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>
<style>
  text {
    font-family: Microsoft YaHei, Noto Sans CJK SC, SimHei, Arial, sans-serif;
    dominant-baseline: alphabetic;
  }
  .card {
    filter: url(#shadow);
  }
</style>

<text x="960" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#1f2937">数据证据层与可谈判偏好轴映射</text>
<text x="960" y="104" text-anchor="middle" font-size="20" font-weight="500" fill="#64748b">LLM 决定先探什么；确定性探针返回候选和证据；谈判器组织可解释对比</text>
<rect class="card" x="85" y="175" width="390" height="95" rx="18" fill="#e6f2ff" stroke="#7aa7d9" stroke-width="2"/>
<text x="280.0" y="216" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">招生事实</text>
<text x="280.0" y="243" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">最低分 / 位次 / 选科</text>
