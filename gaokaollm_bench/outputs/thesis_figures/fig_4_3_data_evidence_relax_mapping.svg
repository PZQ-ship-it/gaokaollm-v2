<text x="280.0" y="636" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">成本证据</text>
<text x="280.0" y="663" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">学费与预算差</text>
