<text x="1630.0" y="538" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">地域层级放宽</text>
<text x="1630.0" y="565" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">偏好显性化证据</text>
<rect class="card" x="1220" y="760" width="480" height="110" rx="18" fill="#f4f6f8" stroke="#9aa4af" stroke-width="2"/>
<text x="1460.0" y="794" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2937">证据谈判器</text>
<text x="1460.0" y="822" text-anchor="middle" font-size="21" font-weight="500" fill="#1f2937">对比硬约束基线与可谈判机会</text>
<text x="1460.0" y="850" text-anchor="middle" font-size="21" font-weight="500" fill="#1f2937">城市层级不直接计入客观收益</text>
