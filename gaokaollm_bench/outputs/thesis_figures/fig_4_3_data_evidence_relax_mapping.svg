<text x="280.0" y="356" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">专业层级本体</text>
<text x="280.0" y="383" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">规则挂载 + 模型候选 + LLM 复核</text>
<rect class="card" x="85" y="455" width="390" height="95" rx="18" fill="#e6f2ff" stroke="#7aa7d9" stroke-width="2"/>
