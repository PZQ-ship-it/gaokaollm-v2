<text x="1275.0" y="395" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">小幅超预算</text>
<rect class="card" x="1475" y="320" width="310" height="110" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="1630.0" y="368" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">专业质量放宽</text>
<text x="1630.0" y="395" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">质量收益证据</text>
<rect class="card" x="1120" y="490" width="310" height="110" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="1275.0" y="538" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">就业导向放宽</text>
<text x="1275.0" y="565" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">结果证据</text>
