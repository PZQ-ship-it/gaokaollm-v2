<text x="790.0" y="558" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">确定性证据探针</text>
<text x="790.0" y="587" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">SQL / 本体 / 画像查询</text>
<text x="790.0" y="616" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">唯一事实候选来源</text>
