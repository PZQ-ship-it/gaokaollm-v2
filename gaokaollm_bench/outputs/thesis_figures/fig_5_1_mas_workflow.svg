<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="100%" height="100%" fill="#ffffff"/>

<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,5 L0,10 Z" fill="#64748b"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>
<style>
  text {
    font-family: Microsoft YaHei, Noto Sans CJK SC, SimHei, Arial, sans-serif;
    dominant-baseline: alphabetic;
  }
  .card {
    filter: url(#shadow);
  }
</style>

<text x="960" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#1f2937">轻量 MAS 工作流：LLM 规划，确定性探针给出事实候选</text>
<text x="960" y="104" text-anchor="middle" font-size="20" font-weight="500" fill="#64748b">实现角色可括注为 gatekeeper / radar / negotiator，但正文主叙述采用学术化角色名</text>
<rect class="card" x="85" y="205" width="270" height="120" rx="18" fill="#ffffff" stroke="#9aa4af" stroke-width="2"/>
<text x="220.0" y="243" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">用户显式话语</text>
<text x="220.0" y="272" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">分数 / 专业 / 地域</text>
<text x="220.0" y="301" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">风险 / 预算</text>
<rect class="card" x="430" y="205" width="285" height="120" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="572.5" y="243" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">前置语义归一</text>
<text x="572.5" y="272" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">CoT 查询重写</text>
<text x="572.5" y="301" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">偏好轴拆解</text>
<rect class="card" x="790" y="205" width="285" height="120" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="932.5" y="243" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">约束解析器</text>
<text x="932.5" y="272" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">实体抽取</text>
<text x="932.5" y="301" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">SQL 硬约束锁定</text>
<rect class="card" x="1150" y="205" width="300" height="120" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="1300.0" y="243" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">LLM 机会规划器</text>
<text x="1300.0" y="272" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">probe_plan</text>
<text x="1300.0" y="301" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">排序 / 澄清提示</text>
<rect class="card" x="790" y="460" width="300" height="150" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="940.0" y="499" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">确定性证据探针</text>
<text x="940.0" y="528" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">专业-地域 / 风险组合</text>
<text x="940.0" y="557" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">预算 / 质量 / 就业</text>
<text x="940.0" y="586" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">地域层级</text>
<rect class="card" x="1150" y="460" width="300" height="150" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="1300.0" y="499" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">可谈判机会集合</text>
<text x="1300.0" y="528" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">事实候选</text>
<text x="1300.0" y="557" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">证据来源</text>
<text x="1300.0" y="586" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">收益计算</text>
<rect class="card" x="1515" y="460" width="300" height="150" rx="18" fill="#e8f7ed" stroke="#67a87b" stroke-width="2"/>
<text x="1665.0" y="499" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">证据谈判器</text>
<text x="1665.0" y="528" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">保留什么</text>
<text x="1665.0" y="557" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">放宽什么</text>
<text x="1665.0" y="586" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">换来什么</text>
<rect class="card" x="790" y="735" width="300" height="105" rx="18" fill="#f4f6f8" stroke="#9aa4af" stroke-width="2"/>
<text x="940.0" y="780" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">硬约束基线</text>
<text x="940.0" y="809" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">只返回显式约束内结果</text>
<rect class="card" x="1515" y="735" width="300" height="105" rx="18" fill="#f4f6f8" stroke="#9aa4af" stroke-width="2"/>
<text x="1665.0" y="780" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">面向用户的回复</text>
<text x="1665.0" y="809" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">二选一式偏好启发</text>
<rect class="card" x="430" y="735" width="285" height="105" rx="18" fill="#fff3cf" stroke="#d6a23a" stroke-width="2"/>
<text x="572.5" y="780" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">hidden fields</text>
<text x="572.5" y="809" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">业务 Agent 不可见</text>
<path d="M355,265 L430,265" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M715,265 L790,265" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1075,265 L1150,265" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1300,325 1300,390 940,390 940,460" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="940" y="378" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">选择探测轴</text>
<path d="M1090,535 L1150,535" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1450,535 L1515,535" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="932,325 932,690 940,735" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="932" y="678" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">对照</text>
<polyline points="1090,785 1360,785 1515,585" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1665,610 L1665,735" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M715,785 L790,785" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 8"/>
<text x="752.5" y="775.0" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">不进入业务链</text>
<rect x="1185" y="360" width="304" height="42" rx="21" fill="#ffffff" stroke="#67a87b" stroke-width="1.8"/>
<text x="1337.0" y="388" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">LLM 只规划，不编造事实候选</text>
</svg>
