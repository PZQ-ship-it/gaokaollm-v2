<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="100%" height="100%" fill="#ffffff"/>

<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,5 L0,10 Z" fill="#64748b"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>
<style>
  text {
    font-family: Microsoft YaHei, Noto Sans CJK SC, SimHei, Arial, sans-serif;
    dominant-baseline: alphabetic;
  }
  .card {
    filter: url(#shadow);
  }
</style>

<text x="960" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#1f2937">数据证据驱动的交互式偏好启发闭环</text>
<text x="960" y="104" text-anchor="middle" font-size="20" font-weight="500" fill="#64748b">数据层提供事实边界，业务 Agent 进行语义归一、机会规划与证据谈判，Benchmark 负责可复核评测</text>
<rect x="70" y="165" width="430" height="710" rx="28" fill="#e6f2ff" stroke="#7aa7d9" stroke-width="2" opacity="0.95"/>
<text x="98" y="207" text-anchor="start" font-size="26" font-weight="700" fill="#1f2937">数据层</text>
<rect class="card" x="115" y="245" width="340" height="110" rx="18" fill="#ffffff" stroke="#7aa7d9" stroke-width="2"/>
<text x="285.0" y="293" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">招生事实库</text>
<text x="285.0" y="322" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">分数 / 位次 / 选科 / 学费</text>
<rect class="card" x="115" y="405" width="340" height="130" rx="18" fill="#ffffff" stroke="#7aa7d9" stroke-width="2"/>
<text x="285.0" y="448" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">层级画像</text>
<text x="285.0" y="477" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">专业层级本体</text>
<text x="285.0" y="506" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">地域层级画像</text>
<rect class="card" x="115" y="585" width="340" height="130" rx="18" fill="#ffffff" stroke="#7aa7d9" stroke-width="2"/>
<text x="285.0" y="628" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">收益画像</text>
<text x="285.0" y="657" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">专业质量</text>
<text x="285.0" y="686" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">就业结果</text>
<rect x="565" y="165" width="790" height="710" rx="28" fill="#e8f7ed" stroke="#67a87b" stroke-width="2" opacity="0.95"/>
<text x="593" y="207" text-anchor="start" font-size="26" font-weight="700" fill="#1f2937">轻量 MAS Agent</text>
<rect class="card" x="610" y="245" width="290" height="105" rx="18" fill="#ffffff" stroke="#67a87b" stroke-width="2"/>
<text x="755.0" y="290" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">前置语义归一</text>
<text x="755.0" y="319" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">查询重写 / 偏好轴拆解</text>
<rect class="card" x="1020" y="245" width="290" height="105" rx="18" fill="#ffffff" stroke="#67a87b" stroke-width="2"/>
<text x="1165.0" y="290" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">约束解析器</text>
<text x="1165.0" y="319" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">显式约束 / SQL 锁定</text>
<rect class="card" x="610" y="445" width="290" height="120" rx="18" fill="#ffffff" stroke="#67a87b" stroke-width="2"/>
<text x="755.0" y="483" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">LLM 机会规划器</text>
<text x="755.0" y="512" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">排序 / 澄清</text>
<text x="755.0" y="541" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">不生成事实候选</text>
<rect class="card" x="1020" y="445" width="290" height="120" rx="18" fill="#ffffff" stroke="#67a87b" stroke-width="2"/>
<text x="1165.0" y="498" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">确定性证据探针</text>
<text x="1165.0" y="527" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">SQL / 本体 / 画像查询</text>
<rect class="card" x="815" y="655" width="290" height="105" rx="18" fill="#ffffff" stroke="#67a87b" stroke-width="2"/>
<text x="960.0" y="700" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">证据谈判器</text>
<text x="960.0" y="729" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">对比基线并组织回复</text>
<rect x="1420" y="165" width="430" height="420" rx="28" fill="#f1eaff" stroke="#9b83d4" stroke-width="2" opacity="0.95"/>
<text x="1448" y="207" text-anchor="start" font-size="26" font-weight="700" fill="#1f2937">Benchmark 层</text>
<rect class="card" x="1465" y="255" width="340" height="115" rx="18" fill="#ffffff" stroke="#9b83d4" stroke-width="2"/>
<text x="1635.0" y="305" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">冰山用户画像</text>
<text x="1635.0" y="334" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">显式话语 + 隐藏妥协</text>
<rect class="card" x="1465" y="420" width="340" height="115" rx="18" fill="#ffffff" stroke="#9b83d4" stroke-width="2"/>
<text x="1635.0" y="470" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">多轮评测器</text>
<text x="1635.0" y="499" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">事实命中 + 过程检查</text>
<rect x="1420" y="650" width="430" height="225" rx="28" fill="#f4f6f8" stroke="#9aa4af" stroke-width="2" opacity="0.95"/>
<text x="1448" y="692" text-anchor="start" font-size="26" font-weight="700" fill="#1f2937">论文产物</text>
<rect class="card" x="1465" y="730" width="340" height="95" rx="18" fill="#ffffff" stroke="#9aa4af" stroke-width="2"/>
<text x="1635.0" y="770" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">聚合指标 / 逐例证据</text>
<text x="1635.0" y="799" text-anchor="middle" font-size="22" font-weight="500" fill="#1f2937">论文图表与失败分析</text>
<path d="M455,300 L610,300" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="532.5" y="290.0" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">硬约束事实</text>
<polyline points="455,470 520,470 520,610 1165,610 1165,565" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="520" y="598" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">证据空间</text>
<path d="M900,298 L1020,298" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1165,350 1165,410 755,410 755,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="755" y="398" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">显式意图</text>
<path d="M900,505 L1020,505" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="960.0" y="495.0" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">规划探针</text>
<polyline points="1165,565 1165,705 1105,705" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1105,705 1375,705 1375,312 1465,312" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1375" y="300" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">证据链</text>
<path d="M1635,535 L1635,730" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1635.0" y="622.5" text-anchor="middle" font-size="17" font-weight="600" fill="#64748b">结果</text>
</svg>
