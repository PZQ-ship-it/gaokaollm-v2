repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
    -   id: ruff
        args: [--fix]
    -   id: ruff-format
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.1
    hooks:
    -   id: mypy
        pass_filenames: false
        args:
        - --ignore-missing-imports
        - --no-site-packages
        - --follow-imports=skip
        - gaokaollm_bench/chains
        - gaokaollm_bench/constrains
        - gaokaollm_bench/contracts
        - gaokaollm_bench/flows
        - gaokaollm_bench/graphs
        - gaokaollm_bench/llm
        - gaokaollm_bench/prompts
        - gaokaollm_bench/sandbox
        - gaokaollm_bench/simulator
        - gaokaollm_bench/evaluator
        - gaokaollm_bench/schemas.py
